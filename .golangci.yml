version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - gosec
    - gocritic
    - misspell

  settings:
    gocritic:
      enabled-checks:
        - commentedOutCode
        - nilValReturn
        - sloppyReassign
        - truncateCmp
        - weakCond
    govet:
      disable:
        - fieldalignment

  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: scripts/sync_skill_test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/flyingnobita/llml
