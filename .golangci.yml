version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - gosec
    - gocritic
    - misspell
    - forbidigo

  settings:
    gocritic:
      enabled-checks:
        - commentedOutCode
        - nilValReturn
        - sloppyReassign
        - truncateCmp
        - weakCond
    govet:
      disable:
        - fieldalignment
    forbidigo:
      # AGENTS.md: styles are built once in newStyles so a theme change
      # restyles everything. An inline style silently ignores the active theme.
      forbid:
        - pattern: ^lipgloss\.NewStyle$
          msg: build styles in internal/tui/styles.go (newStyles), not inline
      analyze-types: true
    errcheck:
      # Writes to the CLI's own stdout/stderr. A failure there cannot be
      # reported (the place to report it is what failed) and is not
      # actionable, so checking these returns would add noise, not safety.
      # Every other io.Writer error is still checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: scripts/sync_skill_test\.go
        linters:
          - gosec
          - errcheck
      # styles.go is where styles are supposed to be built.
      - path: internal/tui/styles\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/flyingnobita/llml
