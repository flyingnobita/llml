# mise: package and tool management
# https://mise.jdx.dev/
# Machine-specific [env] (paths, ports): use mise.local.toml (gitignored).

[tools]
go = "latest"
node = "lts"
# Pin aligns with homebrew_casks `binary:`; bump past 2.12.6 then switch to `binaries:` in .goreleaser.yaml per upstream.
goreleaser = "2.12.2"
"pipx:pre-commit" = "latest"
"github:golangci/golangci-lint" = "latest"

[tasks]
run = "go run ./cmd/llml"
build = "go build -o bin/llml ./cmd/llml"
fmt = "go fmt ./..."
fmt-check = "scripts/gofmt-check.sh"
vet = "go vet ./..."
test = "go test -race ./..."
prettier-fix = "npx prettier --write \"**/*.{md,yaml,yml,json}\" \".prettierrc\""
prettier-check = "npx prettier --check \"**/*.{md,yaml,yml,json}\" \".prettierrc\""
markdownlint-fix = "npx markdownlint-cli2 --fix \"**/*.md\" \"#**/skills/**\""
markdownlint-check = "npx markdownlint-cli2 \"**/*.md\" \"#**/skills/**\""
goreleaser-check = "goreleaser check"
golangci-lint = "golangci-lint run ./..."
format = "mise run fmt && mise run prettier-fix && mise run markdownlint-fix && golangci-lint --fix ./..."
lint = "mise run fmt-check && mise run golangci-lint && mise run vet && mise run prettier-check && mise run markdownlint-check && mise run goreleaser-check"
check = "mise run lint && mise run test"
sync = "git submodule sync --recursive && git submodule update --init --recursive"  # Align submodule remotes and checkout their pinned commits.
dev-docs-pull = "scripts/dev_docs_pull.sh"  # Sync and update the dev-docs submodule from its remote (see scripts/dev_docs_pull.sh).
dev-docs-check-pins = "scripts/dev_docs_check_pins.sh"  # Fail if catalog and launcher dev-docs gitlinks differ.
dev-docs-bump-parents = "scripts/dev_docs_bump_parents.sh"  # Commit matching dev-docs pins in catalog + launcher (run after llml-internal merges).
pull-latest = "git pull --rebase origin main --no-recurse-submodules && mise run dev-docs-pull"  # Rebase without submodule fetch during pull (submodule.recurse breaks rebase); dev-docs-pull updates dev-docs.
worktree-setup = "npm ci && go mod download && git submodule update --init --recursive && LLML_AGENTS_SYNC=import ./scripts/sync_gitignore_agents.sh"  # Install JS/Go deps, init submodules, import gitignored agent paths for a linked worktree.
